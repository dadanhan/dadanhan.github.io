<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- 1. Automatically redirects after 0 seconds to the new URL -->
    <meta http-equiv="refresh" content="0;url=https://sites.google.com/view/dadanhan/" />
    <!-- 2. Tells search engines that the new site is the primary version -->
    <link rel="canonical" href="https://sites.google.com/view/dadanhan/" />
    <title>Redirecting...</title>
  </head>
  <body>
    <h1>The page has moved</h1>
    <p>If you are not automatically redirected, <a href="https://sites.google.com/view/dadanhan/">click here to go to the new site</a>.</p>
  </body>
</html>
